vertx:
  env: dev
  host: "127.0.0.1"
  multicast: false
  members: "127.0.0.1"
server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,storageMode
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: bifro-test-bed
    export:
      prometheus:
        enabled: true

bifro:
  node-role: ALL
  node-id: "default-broker-1"
  storage:
    mode: EMBEDDED
  scheduler:
    enabled: true
    max-pending-tasks: 10000
    max-delay: 5m
    default-timeout: 30s
  metrics:
    cleanup-delay: 30s
  shutdown:
    graceful-enabled: true
    task-stop-timeout: 120s
    task-stop-per-task-timeout: 120s
    participant-timeout: 10s
    reject-start-when-shutting-down: true
    log-pending-tasks: true
  security:
    enabled: true
    session-timeout: 8h
    users: []
logging:
  config: classpath:log4j2.xml


spring:
  lifecycle:
    timeout-per-shutdown-phase: 150s
  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: true
  data:
    mongodb:
      auto-index-creation: true
      host: "localhost"
      port: 27017
      database: "bifro-test-suite"
