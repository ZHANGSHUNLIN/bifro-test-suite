vertx:
  env: dev
  host: "127.0.0.1"
  multicast: false
  members: "127.0.0.1"
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: bifro-test-bed
    export:
      prometheus:
        enabled: true

bifro:
  nodeName: "Default Broker2"
  security:
    enabled: true
    session-timeout: 8h
    users: []
logging:
  config: classpath:log4j2.xml


spring:
  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: true
  data:
    mongodb:
      host: "localhost"
      port: 27017
      database: "bifro-test-suite"
