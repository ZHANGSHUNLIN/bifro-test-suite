# Import this file after application.yml for single-control embedded MongoDB deployments.
# Embedded mode is not a control-plane HA mode. Start only one control/all node with this profile.
bifro:
  node-role: control
  node-id: "embedded-control-1"
  storage:
    mode: embedded
    embedded:
      data-dir: "./data/mongo"
      database: "bifro-test-local"
      port: 0
      startup-timeout: 30s
      allow-control-takeover: false

# In embedded mode, do not configure remote spring.data.mongodb.*.
# Spring Data Mongo receives its local connection from EmbeddedMongoConfig.
