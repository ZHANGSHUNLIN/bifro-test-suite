vertx:
  env: dev
  host: "127.0.0.1"
  multicast: false
  members: "127.0.0.1"
server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

bifro:
  nodeName: "node-sandbox"
  security:
    enabled: true
    session-timeout: 8h
    users: []
  mqtt:
    default:
      clusterMembers:
        - host: "localhost"
          port: 1883
          broker-id: "Default Broker"
          enabled: true
          name: "Default Broker"
logging:
  config: file:conf/log4j2.xml
spring:
  data:
    mongodb:
      host: "localhost"
      port: 27017
      database: "bifro-test-suite"
  springdoc:
    api-docs:
      enabled: true
      path: /v3/api-docs
    swagger-ui:
      enabled: true
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: alpha
    packages-to-scan: org.apache.bifromq.testsuite.app.controller
