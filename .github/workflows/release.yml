name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 1.0.24
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  MAVEN_ARGS: -B -ntp
  PNPM_VERSION: "10"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Validate release tag
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Check Apache RAT
        run: mvn $MAVEN_ARGS apache-rat:check -DskipTests -DskipFrontend=true

      - name: Install frontend dependencies
        working-directory: bifro-test-fe
        run: pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com

      - name: Build frontend
        working-directory: bifro-test-fe
        run: pnpm build

      - name: Build full release artifact
        run: >
          mvn $MAVEN_ARGS -U clean package
          -DskipFrontend=true
          -DskipFrontendResources=false
          -Drevision="${RELEASE_VERSION}"

      - name: Copy full release artifact
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp bifro-test-bed/target/bifro-test-bed-${RELEASE_VERSION}-all.tar.gz release-assets/

      - name: Build backend-only release artifact
        run: >
          mvn $MAVEN_ARGS -U clean package
          -DskipTests
          -DskipFrontend=true
          -DskipFrontendResources=true
          -Drevision="${RELEASE_VERSION}"

      - name: Copy backend-only release artifact
        run: |
          set -euo pipefail
          cp bifro-test-bed/target/bifro-test-bed-${RELEASE_VERSION}-all.tar.gz \
            release-assets/bifro-test-suite-${RELEASE_VERSION}-backend.tar.gz

      - name: Package frontend-only release artifact
        run: |
          set -euo pipefail
          (cd bifro-test-fe/dist && zip -qr ../../release-assets/bifro-test-suite-${RELEASE_VERSION}-frontend.zip .)

      - name: Generate Maven SBOM
        run: >
          mvn $MAVEN_ARGS
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DskipTests
          -DskipFrontend=true
          -Drevision="${RELEASE_VERSION}"
          -DoutputFormat=json
          -DoutputName=bom

      - name: Prepare release assets
        run: |
          set -euo pipefail
          cp target/bom.json release-assets/bifro-test-suite-${RELEASE_VERSION}-sbom.json
          (cd release-assets && sha256sum * > SHA256SUMS)

      - name: Generate release notes
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          previous_tag="$(git tag --sort=-version:refname | grep -v "^${RELEASE_TAG}$" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            changelog_range="${previous_tag}..HEAD"
            range_label="${previous_tag}...${RELEASE_TAG}"
          else
            changelog_range="HEAD"
            range_label="initial release"
          fi

          {
            echo "## Changelog"
            echo
            echo "Range: ${range_label}"
            echo
            echo "## Changes"
            echo
          } > release-notes.md

          commit_count=0
          while IFS= read -r commit; do
            commit_count=$((commit_count + 1))
            subject="$(git log -1 --format=%s "${commit}")"
            body="$(git log -1 --format=%b "${commit}" | sed '/^[[:space:]]*$/d')"

            {
              printf -- "- %s (%s)\n" "${subject}" "${commit:0:7}"
              if [ -n "${body}" ]; then
                printf '%s\n' "${body}" | sed 's/^/  /'
              fi
              echo
            } >> release-notes.md
          done < <(git log --reverse --no-merges --format=%H "${changelog_range}")

          if [ "${commit_count}" -eq 0 ]; then
            echo "- No commits found in this release range." >> release-notes.md
          fi

          {
            echo
            echo "## Assets"
            echo
            echo "- Full package: bifro-test-bed-${RELEASE_VERSION}-all.tar.gz"
            echo "- Backend-only package: bifro-test-suite-${RELEASE_VERSION}-backend.tar.gz"
            echo "- Frontend-only package: bifro-test-suite-${RELEASE_VERSION}-frontend.zip"
            echo "- SBOM: bifro-test-suite-${RELEASE_VERSION}-sbom.json"
            echo "- Checksums: SHA256SUMS"
          } >> release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${RELEASE_TAG}" \
            release-assets/* \
            --target "${GITHUB_SHA}" \
            --title "bifro-test-suite ${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            --fail-on-no-commits \
            ${prerelease_flag}
